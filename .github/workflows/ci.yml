name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # @bifrost-compute/bifrost-client comes from GitHub Packages; the .npmrc
          # reads NODE_AUTH_TOKEN. GITHUB_TOKEN has read:packages here.
          registry-url: "https://npm.pkg.github.com"
          scope: "@bifrost-compute"
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The dashboard in a browser, against a real Keycloak and a real Bifrost.
  #
  # Separate from `build` because it is a different kind of evidence: unit
  # tests say the gates compute the right answer, this says a person with a
  # project grant can actually use the page. Three shipped bugs were invisible
  # to the former and obvious to the latter.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bifrost-compute"
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build the SPA
        run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The issuer must name the same host from the browser and from inside
      # the Bifrost container. `*.localtest.me` resolves to 127.0.0.1 in
      # public DNS; this removes the dependency on the runner's resolver.
      - name: Resolve the IdP hostname
        run: echo '127.0.0.1 keycloak.localtest.me' | sudo tee -a /etc/hosts
      - name: Start the stack
        run: npm run e2e:up
      - name: Test
        run: npm run test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f e2e/stack/compose.yml logs --tail=200
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: npm run e2e:down
